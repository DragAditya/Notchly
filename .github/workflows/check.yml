name: CI

# Type-checks and builds the frontend, then compiles and lints the backend on
# every push and pull request, so breakage shows up before a release tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # Installs the toolchain pinned in code/src-tauri/rust-toolchain.toml.
      - name: Install Rust
        working-directory: code/src-tauri
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: code/src-tauri -> target

      - name: Install dependencies
        working-directory: code
        run: bun install --frozen-lockfile

      # Also produces `code/dist/`, which `tauri::generate_context!` embeds.
      - name: Build frontend
        working-directory: code
        run: bun run build

      - name: Format
        working-directory: code/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: code/src-tauri
        run: cargo clippy -- -D warnings

      - name: Test
        working-directory: code/src-tauri
        run: cargo test --lib

      # A dependency change shows up here before `Cargo.lock` is committed.
      - name: Lockfile up to date
        run: git diff --exit-code -- code/src-tauri/Cargo.lock

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cargo.lock
          path: code/src-tauri/Cargo.lock
